[workspace]
resolver = "2"
members = ["crates/client", "crates/core", "crates/desktop/src-tauri", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
srud-core = { path = "crates/core" }
srud-client = { path = "crates/client" }
srud-protocol = { path = "crates/protocol" }
# Pinned exactly: upgrading this is a protocol review, not a dependency bump.
agent-client-protocol-schema = { version = "=1.9.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
async-openai = { version = "0.42", features = ["responses", "chat-completion"] }
async-stream = "0.3"
dotenvy = "0.15"
