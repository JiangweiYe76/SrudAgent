[workspace]
resolver = "2"
members = ["crates/client", "crates/core", "crates/desktop/src-tauri", "crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
srud-core = { path = "crates/core" }
srud-client = { path = "crates/client" }
srud-protocol = { path = "crates/protocol" }
srud-server = { path = "crates/server" }
# Pinned exactly: upgrading this is a protocol review, not a dependency bump.
agent-client-protocol-schema = { version = "=1.9.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "process", "time"] }
tokio-util = "0.7"
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
# `byot` lets the chat adapter stream into its own chunk type, which is the
# only way to see `reasoning_content` — a field the SDK's types do not model.
async-openai = { version = "0.42", features = ["responses", "chat-completion", "byot"] }
async-stream = "0.3"
dotenvy = "0.15"
# The search engine ripgrep itself uses, as a library. Spawning the `rg` binary
# instead would leave the tool unusable on a machine that has not installed it,
# and would make its behaviour depend on whichever version that machine carries.
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"
