[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
srud-core = { workspace = true }
srud-client = { workspace = true }
srud-protocol = { workspace = true }
srud-server = { workspace = true }
dotenvy = { workspace = true }
tauri-plugin-opener = "2"
base64 = "0.22"

# Reading the system clipboard directly, for the pastes a webview hands over
# empty. GTK is the toolkit the webview already runs on, so this unifies with
# the version it links.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }
futures = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
