[package]
name = "srud-server"
version.workspace = true
edition.workspace = true
description = "ACP v1 agent service: JSON-RPC dispatch over the core runtime, transport-agnostic."

[dependencies]
srud-core = { workspace = true }
srud-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# Session logs are laid out by date, so the path a log is written to depends on
# when the session was created.
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }
futures = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
srud-client = { workspace = true }
dotenvy = { workspace = true }
